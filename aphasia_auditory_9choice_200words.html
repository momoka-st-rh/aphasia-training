const shuffle=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x};

function sample20(){return shuffle(WORDS).slice(0,20)}
function choicesFor(target){let pool=WORDS.filter(w=>w.id!==target.id&&w.pic!==target.pic);let selected=[];
 if(target.cat===10){selected=shuffle(pool.filter(w=>w.cat===10)).slice(0,8)}else{
 // Prefer eight distinct semantic categories, and avoid identical emoji representations.
 let cats=shuffle([...new Set(pool.map(w=>w.cat))].filter(c=>c!==10&&c!==target.cat));
 for(let cat of cats){let candidates=shuffle(pool.filter(w=>w.cat===cat&&!selected.some(s=>s.pic===w.pic)));if(candidates.length)selected.push(candidates[0]);if(selected.length===8)break;}
 }
 if(selected.length<5){for(let w of shuffle(pool)){if(!selected.some(s=>s.id===w.id||s.pic===w.pic)){selected.push(w);if(selected.length===8)break;}}}
 return shuffle([target,...selected]);}
function question(target){return {target,options:choicesFor(target),answer:null,firstAnswer:null,firstCorrect:null,tries:0}}

function start(){original=sample20().map(question);review=[];phase='first';index=0;render()}
function render(){let arr=current();if(index>=arr.length){results();return}show('game');let q=arr[index];$('round').textContent=phase==='first'?'Lần đầu':'Kiểm tra lại';$('counter').textContent=`Câu ${index+1}/${arr.length}`;$('bar').style.width=((index+1)/arr.length*100)+'%';$('target').textContent=q.target.word;$('teacher').open=false;
 let g=$('grid');g.innerHTML='';for(let w of q.options){let b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label','Hình '+(q.options.indexOf(w)+1));if(w.kind==='color'){let d=document.createElement('div');d.className='color';d.style.background=w.pic;b.appendChild(d)}else{let d=document.createElement('span');d.className='emoji';d.textContent=w.pic;b.appendChild(d)}if(q.answer!==null){b.disabled=true;if(w.id===q.target.id){b.classList.add('correct');b.insertAdjacentHTML('beforeend','<span class="tick">✓</span>')}else if(w.id===q.answer)b.classList.add('wrong');}b.onclick=()=>answer(w.id);g.appendChild(b)}
 let f=$('feedback');f.className='feedback';if(q.answer!==null){let ok=q.answer===q.target.id;f.classList.add(ok?'good':'bad');f.textContent=(ok?'✓ Đúng! ':'✗ Chưa đúng. ')+`Đáp án: ${q.target.word}`;}else f.textContent='Nghe và chọn hình đúng';
 $('prev').disabled=index===0;$('next').textContent=index===arr.length-1?'Xem kết quả →':'Tiếp →';$('next').disabled=q.answer===null;
}
function answer(id){let q=current()[index];if(q.answer!==null)return;q.answer=id;q.tries++;if(q.firstCorrect===null){q.firstAnswer=id;q.firstCorrect=id===q.target.id}render()}
function retry(){let q=current()[index];q.options=choicesFor(q.target);q.answer=null;render()}
function move(delta){let arr=current();if(delta>0&&arr[index].answer===null)return;index+=delta;if(index>=arr.length)results();else if(index>=0)render();else index=0}
function results(){show('end');let correct=original.filter(q=>q.firstCorrect===true).length;$('firstScore').textContent=`Lần đầu: ${correct}/20 câu đúng`;
 $('secondScore').textContent=review.length?`Kiểm tra lại: ${review.filter(q=>q.firstCorrect===true).length}/${review.length} câu đúng`:'Kiểm tra lại: Chưa thực hiện';let missed=original.filter(q=>q.firstCorrect===false);$('review').classList.toggle('hidden',phase==='review'||missed.length===0);$('review').textContent=`Kiểm tra lại ${missed.length} từ sai`;
}
$('start').onclick=start;$('restart').onclick=start;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('retry').onclick=retry;$('homeBtn').onclick=()=>show('home');$('endHome').onclick=()=>show('home');$('review').onclick=()=>{review=shuffle(original.filter(q=>q.firstCorrect===false)).map(q=>question(q.target));phase='review';index=0;render()};
</script></body></html>
